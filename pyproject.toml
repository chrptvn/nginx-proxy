[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "header-proxy"
version = "0.1.0"
description = "Session-scoped HTTP header injection proxy with a REST + MCP control plane, TLS MITM, and Chrome-grade TLS fingerprinting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "chrptvn" }]
keywords = ["proxy", "http", "headers", "mitm", "mcp", "playwright", "stealth"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "curl-cffi>=0.9,<1",
  "mcp>=1.9,<2",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[project.scripts]
headerproxy = "headerproxy.__main__:main"

[project.urls]
Homepage = "https://github.com/chrptvn/nginx-proxy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
